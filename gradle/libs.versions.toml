material = "1.12.0"
foundation = "1.11.2"

navigationCompose = "2.8.9"
coil = "2.6.0"
camerax = "1.3.4"
googleGmsGoogleServices = "4.4.4"
firebaseAuth = "24.1.0"
firebaseFirestore = "25.1.1"
